services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cotidian-backend
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - front-network
      - back-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cotidian-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - front-network

  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: cotidian-db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cotidian -d cotidian"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - back-network

networks:
  front-network:
    driver: bridge
  back-network:
    driver: bridge
